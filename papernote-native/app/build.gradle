plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.papernote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.papernote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
