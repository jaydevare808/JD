plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.papernote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.papernote'
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName '1.8.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // Device-test release candidate. Production Google Play builds will use Play App Signing.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
