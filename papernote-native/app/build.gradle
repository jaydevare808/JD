plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.hsc_test_series_2027'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.hsc_test_series_2027'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java_hsc']
            res.srcDirs = ['src/main/res_hsc']
            assets.srcDirs = []
            resources.srcDirs = []
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
}
