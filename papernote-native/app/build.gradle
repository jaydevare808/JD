plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.papernote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.papernote'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    dependencies {
        implementation 'androidx.core:core:1.19.0'
    }
}
