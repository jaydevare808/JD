plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.papernote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.papernote'
        minSdk 26
        targetSdk 36
        versionCode 21
        versionName '3.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        noCompress += ['gguf']
    }

    // Device-test release candidate. Production Google Play builds will use Play App Signing.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
}

def paperNoteAiModel = file("$projectDir/src/main/assets/PaperNote-AI.gguf")
def paperNoteAiModelUrl = "https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/main/SmolLM2-360M-Instruct-Q4_K_M.gguf"
def paperNoteAiModelSha256 = "2fa3f013dcdd7b99f9b237717fa0b12d75bbb89984cc1274be1471a465bac9c2"

tasks.register("preparePaperNoteAiModel") {
    outputs.file(paperNoteAiModel)
    doLast {
        if (paperNoteAiModel.exists() && paperNoteAiModel.length() >= 200_000_000L) {
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            paperNoteAiModel.withInputStream { input ->
                byte[] buffer = new byte[1024 * 1024]
                int read
                while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
            }
            def actual = digest.digest().collect { String.format("%02x", it & 0xff) }.join()
            if (actual == paperNoteAiModelSha256) return
            logger.warn("Existing PaperNote AI model hash mismatch; redownloading.")
        }
        paperNoteAiModel.parentFile.mkdirs()
        logger.lifecycle("Downloading PaperNote offline AI model (~271 MB)...")
        def connection = new URL(paperNoteAiModelUrl).openConnection()
        connection.setInstanceFollowRedirects(true)
        connection.setConnectTimeout(30_000)
        connection.setReadTimeout(120_000)
        connection.setRequestProperty("User-Agent", "PaperNote-Build")
        connection.connect()
        def expected = connection.contentLengthLong
        def temp = new File(paperNoteAiModel.parentFile, paperNoteAiModel.name + ".part")
        if (temp.exists()) temp.delete()
        connection.getInputStream().withCloseable { input ->
            temp.withOutputStream { output ->
                byte[] buffer = new byte[1024 * 1024]
                long downloadedBytes = 0L
                int read
                while ((read = input.read(buffer)) != -1) {
                    output.write(buffer, 0, read)
                    downloadedBytes += read
                }
                output.flush()
                if (downloadedBytes < 200_000_000L) {
                    throw new GradleException("PaperNote AI model download is unexpectedly small: " + downloadedBytes + " bytes")
                }
                if (expected > 0 && downloadedBytes != expected) {
                    logger.warn("Model download size changed: expected " + expected + ", got " + downloadedBytes)
                }
            }
        }
        if (paperNoteAiModel.exists() && !paperNoteAiModel.delete()) {
            throw new GradleException("Unable to replace the previous AI model")
        }
        if (!temp.renameTo(paperNoteAiModel)) {
            throw new GradleException("Unable to install the downloaded AI model")
        }
        def digest = java.security.MessageDigest.getInstance("SHA-256")
        paperNoteAiModel.withInputStream { input ->
            byte[] buffer = new byte[1024 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
        }
        def actual = digest.digest().collect { String.format("%02x", it & 0xff) }.join()
        if (actual != paperNoteAiModelSha256) {
            paperNoteAiModel.delete()
            throw new GradleException("PaperNote AI model SHA-256 mismatch. Expected " + paperNoteAiModelSha256 + ", got " + actual)
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("preparePaperNoteAiModel")
}

