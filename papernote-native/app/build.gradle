plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.papernote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.papernote'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '1.8.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    // TEST ONLY: repeatable CI signing key for Firebase device testing.
    // Replace this with Play App Signing/release signing before production publication.
    signingConfigs {
        papernoteTest {
            storeFile file("../papernote-test.keystore")
            storePassword "papernote-test"
            keyAlias "papernote"
            keyPassword "papernote-test"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.papernoteTest
            minifyEnabled false
            debuggable false
        }
    }

    dependencies {
        implementation 'androidx.core:core:1.17.0'
    }
}
