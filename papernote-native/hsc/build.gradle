plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jd.hsc_test_series_2027'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jd.hsc_test_series_2027'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
