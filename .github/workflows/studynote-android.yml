name: Build StudyNote Android app

on:
  push:
    paths:
      - "education-app/**"
      - ".github/workflows/studynote-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "education-app/**"
      - ".github/workflows/studynote-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: education-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build debug APK and lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-1.1.0-debug-apk
          path: education-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-1.1.0-lint
          path: education-app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
