name: Build StudyNote Android app

on:
  push:
    paths:
      - "education-app/**"
      - ".github/workflows/studynote-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: education-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-debug-apk
          path: education-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: StudyNote-lint-report
          path: education-app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
