name: Build HSC TEST SERIES 2027 APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [hsc-test-series-2027-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hsc-test-series-2027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build HSC app
        working-directory: papernote-native
        run: |
          gradle --no-daemon :app:assembleRelease :app:lintRelease

      - name: Verify release APK
        working-directory: papernote-native
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "HSC TEST SERIES APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 100000
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/HSC_TEST_SERIES_2027.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSC-TEST-SERIES-2027-${{ github.run_number }}
          path: papernote-native/artifacts/HSC_TEST_SERIES_2027.apk
          if-no-files-found: error

      - name: Publish direct APK release
        if: success()
        working-directory: papernote-native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hsc-test-series-2027-${{ github.run_number }}"
          gh release create "$TAG"             "app/build/outputs/apk/release/app-release.apk#HSC_TEST_SERIES_2027.apk"             --target "${{ github.sha }}"             --title "HSC TEST SERIES 2027 • Build ${{ github.run_number }}"             --notes "Installable Android APK for device testing. This is a debug/test release; it contains the current HSC TEST SERIES 2027 demo test engine."
