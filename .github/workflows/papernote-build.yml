name: Build HSC TEST SERIES 2027 APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build HSC app
        id: build
        working-directory: papernote-native
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon :app:assembleRelease --stacktrace > hsc-build.log 2>&1
          status=$?
          cat hsc-build.log
          exit $status

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HSC-TEST-SERIES-2027-diagnostics-${{ github.run_number }}
          path: papernote-native/hsc-build.log
          if-no-files-found: error

      - name: Report Gradle failure in PR
        if: steps.build.outcome != 'success'
        working-directory: papernote-native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "HSC TEST SERIES 2027 — Gradle build failure"
            echo
            tail -n 140 hsc-build.log
          } > /tmp/hsc-build-error.md
          gh pr comment ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --body-file /tmp/hsc-build-error.md

      - name: Verify release APK
        if: steps.build.outcome == 'success'
        working-directory: papernote-native
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)
          echo "HSC TEST SERIES APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 100000
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/HSC_TEST_SERIES_2027.apk

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HSC-TEST-SERIES-2027-${{ github.run_number }}
          path: papernote-native/artifacts/HSC_TEST_SERIES_2027.apk
          if-no-files-found: error

      - name: Publish direct APK release
        if: steps.build.outcome == 'success'
        working-directory: papernote-native
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hsc-test-series-2027-${{ github.run_number }}"
          gh release create "$TAG"             "app/build/outputs/apk/release/app-release.apk#HSC_TEST_SERIES_2027.apk"             --target "${{ github.sha }}"             --title "HSC TEST SERIES 2027 • Build ${{ github.run_number }}"             --notes "Installable Android APK for device testing. This is a test release of the HSC TEST SERIES 2027 app."

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
