name: Build HSC TEST SERIES 2027 APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build HSC app
        working-directory: papernote-native
        run: gradle --no-daemon :hsc:assembleRelease :hsc:lintRelease
      - name: Verify APK
        working-directory: papernote-native
        run: |
          test -f hsc/build/outputs/apk/release/hsc-release.apk
          APK_SIZE=$(stat -c%s hsc/build/outputs/apk/release/hsc-release.apk)
          echo "HSC TEST SERIES APK size: $APK_SIZE bytes"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSC-TEST-SERIES-2027-${{ github.run_number }}
          path: papernote-native/hsc/build/outputs/apk/release/hsc-release.apk
          if-no-files-found: error
