name: Deploy JD Pages

on:
  push:
    branches:
      - main
    paths:
      - 'whythis/**'
      - 'graph-plotter/**'
      - '.github/workflows/whythis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R whythis/. _site/
          mkdir -p _site/graph-plotter
          cp -R graph-plotter/. _site/graph-plotter/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
