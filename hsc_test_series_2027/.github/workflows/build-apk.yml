name: Build HSC Test Series APK

on:
  push:
    branches:
      - hsc-test-series-2027-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble project archive
        run: |
          mkdir -p /tmp/hsc
          cat hsc_test_series_2027/project.part-* > /tmp/hsc/project.b64
          base64 -d /tmp/hsc/project.b64 > /tmp/hsc/project.zip
          unzip -q /tmp/hsc/project.zip -d /tmp
          
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: /tmp/hsc/hsc_test_series_2027
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HSC-TEST-SERIES-2027-debug
          path: /tmp/hsc/hsc_test_series_2027/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
